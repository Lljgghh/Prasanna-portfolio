<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prasanna | Private Portfolio Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#171717;font:15px/1.5 Arial,sans-serif}.wrap{max-width:900px;margin:32px auto;padding:0 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px;margin:16px 0}h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 14px}p{color:#666}label{display:block;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 15px;background:#171717;color:white;font-weight:600;cursor:pointer;margin:8px 6px 0 0}button:disabled{opacity:.55}.secondary{background:#e9e9e5;color:#171717}.danger{background:#a62b2b}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.item{border:1px solid #ddd;border-radius:12px;padding:10px}.item img{width:100%;height:200px;object-fit:cover;border-radius:8px;background:#eee}.item strong{display:block;margin:8px 0}.muted{font-size:12px;color:#777}.top,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#message,#loginMessage{white-space:pre-wrap;color:#8a3b00;overflow-wrap:anywhere}.help{font-size:13px}</style></head>
<body><main class="wrap"><header class="top"><div><h1>Portfolio Admin</h1><p>Private project management</p></div><button id="logout" class="secondary hidden" type="button">Log out</button></header>
<section id="loginPanel" class="panel"><h2>Admin login</h2><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" value="cpro3316@gmail.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="login" type="submit">Sign in</button></form><p id="loginMessage" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><h2 id="formTitle">Add a project</h2><form id="projectForm"><label for="image">Poster image</label><input id="image" type="file" accept="image/*"><label for="title">Project title</label><input id="title" maxlength="140" required placeholder="Project title"><label for="category">Category</label><input id="category" maxlength="100" placeholder="Film poster / Brand design"><div class="actions"><button id="save" type="submit">Upload project</button><button id="cancel" class="secondary hidden" type="button">Cancel edit</button></div></form><p id="message" role="status"></p></div><div class="panel"><div class="top"><h2>Projects</h2><button id="refresh" class="secondary" type="button">Refresh</button></div><div id="projects" class="grid"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
